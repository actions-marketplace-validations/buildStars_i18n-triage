name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log

      # 失败时把测试输出的尾部写进 job summary：公开仓库不登录也能在 run 页面看到
      - name: Test output (on failure)
        if: failure()
        run: |
          {
            echo '## pnpm test output (last 200 lines)'
            echo '```'
            tail -n 200 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm build

      # dogfood：用刚构建的 CLI 扫 examples/demo，产出 SARIF 并做最基本的结构校验
      - name: Scan examples/demo to SARIF
        run: |
          node packages/cli/dist/bin.js examples/demo --only all --format sarif --out i18n-triage.sarif
          node -e "const s=require('./i18n-triage.sarif'); if (s.version!=='2.1.0'||!s.runs[0].results.length) process.exit(1); console.log('sarif results:', s.runs[0].results.length)"

      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: demo-sarif
          path: i18n-triage.sarif
