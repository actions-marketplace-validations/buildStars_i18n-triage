name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # 构建链（tsdown / rolldown-plugin-dts）要求 Node ^22.18 || ^24.11，所以只在这两个大版本上构建
    name: lint · typecheck · test · build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log

      - name: Build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      # dogfood：用刚构建的 CLI 扫 examples/demo，产出 SARIF 并做最基本的结构校验
      - name: Scan examples/demo to SARIF
        run: |
          set -o pipefail
          {
            node packages/cli/dist/bin.js examples/demo --only all --format sarif --out i18n-triage.sarif
            node -e "
              const s = JSON.parse(require('fs').readFileSync('i18n-triage.sarif', 'utf8'));
              if (s.version !== '2.1.0' || !s.runs[0].results.length) process.exit(1);
              console.log('sarif results:', s.runs[0].results.length);
            "
          } 2>&1 | tee scan.log

      - name: Pack CLI tarball
        if: matrix.node == 22
        run: pnpm --filter i18n-triage pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: cli-tarball
          path: artifacts/*.tgz

      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: demo-sarif
          path: i18n-triage.sarif

      # 失败时把各步骤输出的尾部写进 job summary：公开仓库不登录也能在 run 页面看到
      - name: Step output (on failure)
        if: failure()
        run: |
          for f in test.log build.log scan.log; do
            [ -f "$f" ] || continue
            {
              echo "## $f (last 150 lines)"
              echo '```'
              tail -n 150 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

  runtime-smoke:
    # 发出去的包声明 Node >= 20.19：在 Node 20 上安装 tarball 并真正跑一遍，不走构建链
    name: install tarball and run (node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: examples/demo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
          path: artifacts

      - name: Install the packed CLI into an empty project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/artifacts/*.tgz

      - name: Run it against examples/demo
        run: |
          cd /tmp/smoke
          ./node_modules/.bin/i18n-triage --version
          ./node_modules/.bin/i18n-triage "$GITHUB_WORKSPACE/examples/demo" --no-color | tee text.log
          grep -q '降噪比' text.log
          ./node_modules/.bin/i18n-triage "$GITHUB_WORKSPACE/examples/demo" --format sarif --out report.sarif
          node -e "
            const s = JSON.parse(require('fs').readFileSync('report.sarif', 'utf8'));
            const a = s.runs[0].properties.summary.byCategory.A_UI_TEXT;
            console.log('A_UI_TEXT:', a);
            if (a !== 21) process.exit(1);
          "
